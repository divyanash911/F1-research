[project]
name = "f1-agents"
version = "0.1.0"
description = "Tool-using LangGraph agents for F1 Intelligence Platform"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "httpx>=0.27",
  "langchain>=0.2.14",
  "langgraph>=0.2.50",
  "langchain-openai>=0.1.20",
  "beautifulsoup4>=4.12.0",
  "langchain-experimental>=0.3.0",
  "pandas>=2.2.0",
  "openai>=1.40",
  "duckduckgo-search>=6.2.13",
  "python-dotenv>=1.0.1",
  "fastf1>=3.6.0",
  "matplotlib>=3.8.0",
  "numpy>=1.26.0",
  "pytest>=8.2",
]

[tool.uvicorn]
factory = false

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["f1_agents_service"]
